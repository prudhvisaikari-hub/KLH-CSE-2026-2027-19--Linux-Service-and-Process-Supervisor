# ----------------------------------------------------------------------
# Service Supervisor Configuration File
#
# Format (whitespace separated):
#   name  path  "arguments"  autorestart(0|1)  max_restarts
#
# - name           : unique identifier used by svctl to control the service
# - path            : full path to the executable
# - "arguments"     : quoted string of arguments passed to the executable
# - autorestart     : 1 = automatically restart on crash, 0 = do not
# - max_restarts    : maximum number of automatic restarts allowed
#
# Lines beginning with # are comments and are ignored.
# ----------------------------------------------------------------------

# A simple long-running "web server" simulation (loops forever)
webserver   /bin/sh   "-c 'while true; do echo webserver heartbeat; sleep 5; done'"   1   5

# A service that crashes shortly after starting, to demonstrate auto-restart
flaky_task  /bin/sh   "-c 'echo flaky_task running; sleep 2; exit 1'"                  1   3

# A background monitoring agent
monitor     /bin/sh   "-c 'while true; do echo monitor tick; sleep 3; done'"           1   5

# A one-shot scheduled task that should NOT be restarted after it finishes
backup_job  /bin/sh   "-c 'echo running backup...; sleep 4; echo backup complete'"     0   0
